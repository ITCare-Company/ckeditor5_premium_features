ckeditor5_premium_features_collaboration.form.settings:
  path: '/admin/config/ckeditor5-premium-features/collaboration'
  defaults:
    _title: 'Collaboration'
    _form: 'Drupal\ckeditor5_premium_features_collaboration\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'

ckeditor5_premium_features_collaboration.annotations:
  path: '/ck5/api/annotations'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\MentionAutocompleteController::annotation'
  methods:  [GET]
  requirements:
    _permission: 'mention users'
    _format: json
