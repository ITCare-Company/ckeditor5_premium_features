ckeditor5_premium_features_collaboration.suggestion.get:
  path: '/ckeditor5/premium/collaboration/suggestion/{ckeditor5_suggestion}'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\SuggestionController::get'
  methods:  [GET]
  requirements:
    # @todo change to entity access.
    _access: 'TRUE'
  options:
    parameters:
      ckeditor5_suggestion:
        entity_type: ckeditor5_suggestion

ckeditor5_premium_features_collaboration.suggestion.add:
  path: '/ckeditor5/premium/collaboration/suggestion'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\SuggestionController::add'
  methods:  [POST]
  requirements:
    # @todo change to entity access.
    _access: 'TRUE'
    _csrf_request_header_token: 'TRUE'

ckeditor5_premium_features_collaboration.suggestion.update:
  path: '/ckeditor5/premium/collaboration/suggestion/{ckeditor5_suggestion}'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\SuggestionController::update'
  methods:  [POST]
  requirements:
    # @todo change to entity access.
    _access: 'TRUE'
    _csrf_request_header_token: 'TRUE'
  options:
    parameters:
      ckeditor5_suggestion:
        entity_type: ckeditor5_suggestion

ckeditor5_premium_features_collaboration.comments:
  path: '/ck5/api/comments'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\CommentController::add'
  methods:  [POST]
  requirements:
    _access: 'TRUE'

ckeditor5_premium_features_collaboration.comments.update:
  path: '/ck5/api/comments/update/{comment_id}/{thread_id}'
  defaults:
    _controller: 'Drupal\ckeditor5_premium_features_collaboration\Controller\CommentController::update'
  methods:  [POST]
  requirements:
    _access: 'TRUE'


