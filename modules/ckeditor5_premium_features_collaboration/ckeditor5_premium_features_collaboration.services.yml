services:
  ckeditor5_premium_features_collaboration.element.text_format:
    class: Drupal\ckeditor5_premium_features_collaboration\Element\TextFormat
    arguments:
      - '@entity_type.manager'
      - '@ckeditor5_premium_features_collaboration.storage_handler.editor'
      - '@ckeditor5_premium_features_collaboration.data_provider.users'
      - '@ckeditor5_premium_features_collaboration.collaboration_settings'
      - '@event_dispatcher'
      - '@current_user'
      - '@state'

  ckeditor5_premium_features_collaboration.data_provider.users:
    class: Drupal\ckeditor5_premium_features_collaboration\DataProvider\UserDataProvider
    arguments:
      - '@current_user'
      - '@entity_type.manager'

  ckeditor5_premium_features_collaboration.storage_handler.editor:
    class: Drupal\ckeditor5_premium_features_collaboration\Storage\EditorStorageHandler
    arguments:
      - '@entity_type.manager'

  ckeditor5_premium_features_collaboration.collaborators:
    class: Drupal\ckeditor5_premium_features_collaboration\Utility\Collaborators
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@ckeditor5_premium_features_collaboration.collaboration_settings'
      - '@ckeditor5_premium_features.mention_integrator'

  ckeditor5_premium_features_collaboration.collaboration_settings:
    class: Drupal\ckeditor5_premium_features_collaboration\Utility\CollaborationSettings
    arguments:
      - '@config.factory'
