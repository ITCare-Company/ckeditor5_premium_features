ckeditor5_premium_features_realtime__comment:
  ckeditor5:
    plugins:
      - cloudServices.CloudServices
      - realtimeAdapter.RealtimeAdapter
      - realTimeCollaboration.PresenceList
      - comments.Comments
      - realTimeCollaboration.RealTimeCollaborativeComments
  drupal:
    label: Comments
    library: ckeditor5_premium_features_realtime/realtime-comments
    admin_library: ckeditor5_premium_features_realtime/admin.comments
    class: Drupal\ckeditor5_premium_features_realtime\Plugin\CKEditor5Plugin\Realtime
    toolbar_items:
      comment:
        label: Comments
    elements: false
    conditions:
      toolbarItem: comment

