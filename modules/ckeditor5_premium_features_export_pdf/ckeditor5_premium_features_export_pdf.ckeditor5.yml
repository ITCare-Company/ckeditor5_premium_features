ckeditor5_premium_features_export_pdf__export_pdf:
  ckeditor5:
    plugins:
     - exportPdf.ExportPdf
    config:
      exportPdf:
        # @todo make the filename dynamic - probably by implementing the plugin class from CKEditor5PluginDefault.
        fileName: 'filename.pdf'
  drupal:
    label: Export to PDF
    library: ckeditor5_premium_features_export_pdf/export-pdf
    admin_library: ckeditor5_premium_features_export_pdf/admin.export_pdf
    class: Drupal\ckeditor5_premium_features_export_pdf\Plugin\CKEditor5Plugin\ExportPdf
    toolbar_items:
      exportPdf:
        label: Export to PDF
    conditions: []
    elements: false
    premium_features:
      plugin: exportPdf
      settings_form: Drupal\ckeditor5_premium_features_export_pdf\Form\SettingsForm
      configuration: ckeditor5_premium_features_export_pdf.settings
