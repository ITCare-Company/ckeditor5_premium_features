ckeditor5_premium_features_export_word__export_word:
  ckeditor5:
    plugins:
      - exportWord.ExportWord
  # @todo make the file names dynamic.
    config:
      exportWord:
        fileName: 'filename.docx'
  drupal:
    label: Export to word
    library: ckeditor5_premium_features_export_word/export_word
    admin_library: ckeditor5_premium_features_export_word/admin.export_word
    class: Drupal\ckeditor5_premium_features_export_word\Plugin\CKEditor5Plugin\ExportWord
    toolbar_items:
      exportWord:
        label: Export to word
    elements: false
    conditions: [ ]
    premium_features:
      plugin: exportWord
      settings_form: Drupal\ckeditor5_premium_features_export_word\Form\SettingsForm
      configuration: ckeditor5_premium_features_export_word.settings
